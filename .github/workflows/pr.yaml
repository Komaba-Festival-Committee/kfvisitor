name: Build and generate preview, then comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get token to access submodules
        id: kf-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.KF_CHECKOUT_SUBMODULES_CLIENT_ID }}
          private-key: ${{ secrets.KF_CHECKOUT_SUBMODULES_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ steps.kf-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: |
          corepack enable
          corepack prepare yarn@4.6.0 --activate

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install Spreet
        run: cargo install spreet

      - name: Build package
        run: |
          export NPM_TOKEN=${{ secrets.GITHUB_TOKEN }}
          bash build-qa.sh 
          
      - name: Upload built artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-prev-${{ github.event.pull_request.head.sha }}
          path: ./.output/dist
          include-hidden-files: true

  preview-screenshot:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-prev-${{ github.event.pull_request.head.sha }}
          path: ./qa

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Playwright
        run: npm install playwright
 
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
 
      - name: Find files
        run: find .
 
      - name: Start Local Server
        run: |
           npx serve qa -l 3000 & 
           echo "Server starting on port 3000..."
 
      - name: Wait for server to be responsive
        run: |
             npx wait-on http://localhost:3000/76 --timeout 30000
 
      - name: Take Local Preview Screenshots
        run: |
          node -e "
          const { chromium } = require('playwright');
          const viewports = {
            desktop: { width: 1280, height: 720 },
            mobile: { width: 390, height: 844 }
          };
          const pages = {
            home: '/',
            about: '/about'
          };
          (async () => {
            const browser = await chromium.launch();
            for (const [pageName, path] of Object.entries(pages)) {
              for (const [viewportName, size] of Object.entries(viewports)) {
                const page = await browser.newPage();
                await page.setViewportSize(size);
                await page.goto('http://localhost:3000/76' + path, { waitUntil: 'networkidle' });
                await page.screenshot({ path: 'screenshot-' + pageName + '-' + viewportName + '.png' });
                await page.close();
              }
            }
            await browser.close();
          })();
          "

      - name: Verify that screenshot exists
        run: ls *.png

      - name: Upload to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="pr-images-${{ github.event.pull_request.head.sha }}"
          gh release create $RELEASE_TAG --repo "$GITHUB_REPOSITORY" --notes "Image Upload Generated for PR Review" || true
          gh release upload $RELEASE_TAG *.png --repo "$GITHUB_REPOSITORY" --clobber

      - name: Comment PR with Image URL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="pr-images-${{ github.event.pull_request.head.sha }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"
          gh issue comment ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --body "## Website preview generated by GitHub Actions

          ### Home
          **Desktop**
          ![Home Desktop](${BASE_URL}/screenshot-home-desktop.png)

          **Mobile**
          ![Home Mobile](${BASE_URL}/screenshot-home-mobile.png)

          ### About
          **Desktop**
          ![About Desktop](${BASE_URL}/screenshot-about-desktop.png)

          **Mobile**
          ![About Mobile](${BASE_URL}/screenshot-about-mobile.png)"

  preview-deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    environment:
      name: preview

    steps:
      - name: Get PR head short SHA to use for preview url
        id: short-sha
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SHORT_SHA="${PR_SHA::7}"
          PREVIEW_URL="https://p-${SHORT_SHA}-preview-pr.komaba-festival-committee.workers.dev/"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Short SHA: $SHORT_SHA"
          echo "Preview URL (to be populated): $PREVIEW_URL"
          echo "sha=${PR_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: build-prev-${{ github.event.pull_request.head.sha }}
          path: ./dist

      - name: Install wrangler version 4
        run: npm install --save-dev wrangler@4

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
          command: versions upload --env preview --preview-alias p-${{ steps.short-sha.outputs.sha }}

      - name: Comment PR with Version URL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --body "## Website preview uploaded to Cloudflare Workers by GitHub Actions

          Access the [website preview](${PREVIEW_URL}) via this URL

          [${PREVIEW_URL}](${PREVIEW_URL})
          "

